services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: screentime_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3350:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: spring_backend
    ports:
      # 8081 is often taken by other stacks (e.g. Evolution API); use 8082 on the host
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/screentime_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  # Rebuild after UI changes: docker compose build frontend --no-cache && docker compose up -d
  frontend:
    build:
      context: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
